<VirtualHost *:443>
    ServerName devticket.duckdns.org
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/devticket.crt
    SSLCertificateKeyFile /etc/ssl/private/devticket.key
    SSLCertificateChainFile /etc/ssl/certs/chain.pem
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
