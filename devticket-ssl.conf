<VirtualHost *:80>
    ServerName 192.168.64.13

    Redirect permanent / https://192.168.64.13/
</VirtualHost>

<VirtualHost *:443>
    ServerName 192.168.64.13

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ticket-tracker.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ticket-tracker.key

    ErrorLog ${APACHE_LOG_DIR}/ticket-tracker-error.log
    CustomLog ${APACHE_LOG_DIR}/ticket-tracker-access.log combined
</VirtualHost>
